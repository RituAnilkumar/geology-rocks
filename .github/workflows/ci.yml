# Continuous integration: runs automatically on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  reuse:
    name: Licence check (reuse lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  content:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validator and compiler tests
        run: python -m pytest pipeline/tests -q
      - name: Check content
        run: PYTHONPATH=pipeline python -m validator --report reports/content-report.md
      # Show the report on the run's summary page on GitHub, pass or fail.
      - name: Publish report
        if: always()
        run: |
          if [ -f reports/content-report.md ]; then
            cat reports/content-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  engine:
    name: Engine tests and scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Engine property tests and unit tests
        run: python -m pytest engine/python/tests -q
      - name: Scenarios
        run: |
          set -o pipefail
          PYTHONPATH=pipeline:engine/python python -m geology_engine scenarios | tee scenarios.txt
      - name: Simulation
        if: always()
        run: PYTHONPATH=pipeline:engine/python python -m geology_engine simulate
      # Show scenario results and the simulation report on the run's summary page.
      - name: Publish results
        if: always()
        run: |
          { echo "## Scenarios"; echo; echo '```'; cat scenarios.txt 2>/dev/null; echo '```'; echo;
            cat reports/simulation-report.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
