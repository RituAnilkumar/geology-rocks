# Continuous integration: runs automatically on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: Licence check (reuse lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  content:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Validator tests
        run: python -m pytest pipeline/tests -q
      - name: Check content
        run: PYTHONPATH=pipeline python -m validator --report reports/content-report.md
      # Show the report on the run's summary page on GitHub, pass or fail.
      - name: Publish report
        if: always()
        run: |
          if [ -f reports/content-report.md ]; then
            cat reports/content-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
